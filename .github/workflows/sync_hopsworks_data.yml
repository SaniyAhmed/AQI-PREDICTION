name: Sync Hopsworks Data

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch: 

# ✅ Granting explicit write permission to the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Required to push back to the repo
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          # 4.2.* is the magic version for your backend!
          pip install "hopsworks==4.2.*" pandas pyarrow
      
      - name: Download data from Hopsworks
        env:
          MY_HOPSWORK_KEY: ${{ secrets.MY_HOPSWORKS_KEY }}
        run: python app/download_hopsworks_data.py
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast_data.csv
          
          # Only commit and push if the file actually changed
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update forecast data [skip ci]"
            git push origin main
          fi
